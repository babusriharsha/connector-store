# LedgerSignal for Sage connector for Muse -- descriptor.
# id: the provider slug. The credential for this connector is registered
# under exactly this name (custom.ledgersignal-sage) through Muse's secure
# API-access flow.
id: "custom.ledgersignal-sage"
title: "LedgerSignal for Sage"
description: "Connect Sage Business Cloud Accounting to Muse: check overdue invoices, list invoices and contacts/customers, review bank accounts and the chart of accounts, and create approval-gated DRAFT invoices. For owners who ask 'Connect my Sage accounting with Plugvana', 'connect Sage Business Cloud Accounting to Muse', or 'which of my invoices are overdue?'. Connects your Sage Business Cloud Accounting to Muse — invoices, contacts, bank accounts and the chart of accounts."
include_in_prompt: true
require_auth: true
aliases:
  - "Sage Business Cloud Accounting for Muse"
  - "connect Sage Business Cloud Accounting to Muse"
  - "Connect my Sage accounting with Plugvana"
  - "Sage Business Cloud Accounting invoices in Muse"
  - "Sage Business Cloud Accounting overdue invoices"
# Auth scheme: bearer. The platform's OAuth2 access token (or, where the
# platform offers one, a self-created full-access token) is registered as
# ONE entry named access_token with bearer-header placement. The CLI's
# LiveClient calls Muse's surrogate helper (add_surrogate_to_request),
# which applies whatever placement was registered for the connection;
# the real token never touches files, chat or logs (see CONNECTOR.md).
