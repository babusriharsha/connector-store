# BookSignal for Xero connector for Muse -- descriptor.
# id: the provider slug. The credential for this connector is registered
# under exactly this name (custom.booksignal-xero) through Muse's secure
# API-access flow.
id: "custom.booksignal-xero"
title: "BookSignal for Xero"
description: "Connect Xero to Muse: check overdue invoices, list invoices and contacts/customers, review bank accounts and the chart of accounts, and create approval-gated DRAFT invoices. For owners who ask 'Connect my Xero with Plugvana', 'connect Xero to Muse', or 'which of my invoices are overdue?'. Connects your Xero organisation to Muse — invoices, contacts, bank transactions and profit & loss."
include_in_prompt: true
require_auth: true
aliases:
  - "Xero for Muse"
  - "connect Xero to Muse"
  - "Connect my Xero with Plugvana"
  - "Xero invoices in Muse"
  - "Xero overdue invoices"
# Auth scheme: bearer. The platform's OAuth2 access token (or, where the
# platform offers one, a self-created full-access token) is registered as
# ONE entry named access_token with bearer-header placement. The CLI's
# LiveClient calls Muse's surrogate helper (add_surrogate_to_request),
# which applies whatever placement was registered for the connection;
# the real token never touches files, chat or logs (see CONNECTOR.md).
auth_scheme: "bearer"
auth_entries:
  - name: "access_token"
    placement: { bearer_header: "Authorization" }
  - name: "license_key"
    placement: { bearer_header: "Authorization" }
    optional: true
api_hosts:
  - "plugvana-licenses.vercel.app"
  - "api.xero.com"
