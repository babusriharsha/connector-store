# BaseSignal for Airtable connector for Muse -- descriptor (Plugvana, CALL SNAP SYSTEMS LLC).
id: "custom.basesignal-airtable"
title: "BaseSignal for Airtable"
description: "Connects your Airtable base to Muse — bases, tables and records you can ask about in plain English. Also known as: Airtable for Muse, connect Airtable to Muse, connect my Airtable, Airtable records in Muse, Airtable base in Muse, check my Airtable base with Muse. Say-sentence: Connect my Airtable with Plugvana."
include_in_prompt: true
require_auth: true
aliases:
  - "Airtable for Muse"
  - "connect Airtable to Muse"
  - "connect my Airtable"
  - "Airtable records in Muse"
  - "Airtable base in Muse"
  - "check my Airtable base with Muse"
  - "Connect my Airtable with Plugvana"
auth_scheme: "bearer"
auth_entries:
  - name: "access_token"
    placement: { bearer_header: "Authorization" }
  - name: "license_key"
    placement: { query_param: "license_key" }
    optional: true
api_hosts:
  - "plugvana-licenses.vercel.app"
  - "api.airtable.com"
# Placement note: Muse's surrogate helper applies the registered placement
# above on egress to the api host only. For query placement (Pipedrive
# api_token) the parameter is applied as a query parameter; for header
# placement (Zoho) the token is supplied in the Authorization header under
# Zoho's Zoho-oauthtoken scheme (see CONNECTOR.md).
