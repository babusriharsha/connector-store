# PipeSignal for Pipedrive connector for Muse -- descriptor (Plugvana, CALL SNAP SYSTEMS LLC).
id: "custom.pipesignal-pipedrive"
title: "PipeSignal for Pipedrive"
description: "Connects your Pipedrive company to Muse — persons, deals, organisations, activities and pipelines. Also known as: Pipedrive for Muse, connect Pipedrive to Muse, connect my Pipedrive, Pipedrive deals in Muse, Pipedrive pipeline in Muse, stalled deals in Muse, sales activities in Muse. Say-sentence: Connect my Pipedrive with Plugvana."
include_in_prompt: true
require_auth: true
aliases:
  - "Pipedrive for Muse"
  - "connect Pipedrive to Muse"
  - "connect my Pipedrive"
  - "Pipedrive deals in Muse"
  - "Pipedrive pipeline in Muse"
  - "stalled deals in Muse"
  - "sales activities in Muse"
  - "Connect my Pipedrive with Plugvana"
auth_scheme: "api_key"
auth_entries:
  - name: "api_token"
    placement: { query_param: "api_token" }
  - name: "license_key"
    placement: { query_param: "license_key" }
    optional: true
api_hosts:
  - "plugvana-licenses.vercel.app"
  - "api.pipedrive.com"
# Placement note: Muse's surrogate helper applies the registered placement
# above on egress to the api host only. For query placement (Pipedrive
# api_token) the parameter is applied as a query parameter; for header
# placement (Zoho) the token is supplied in the Authorization header under
# Zoho's Zoho-oauthtoken scheme (see CONNECTOR.md).
